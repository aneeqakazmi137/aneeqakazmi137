<svg viewBox="0 0 800 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="reiatsu-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#26264C" stop-opacity="0" />
      <stop offset="30%" stop-color="#724972" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#B199DB" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#E9CCD3" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#26264C" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="blade-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#B199DB" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#724972" stop-opacity="0.2" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Reiatsu Energy Wave -->
  <path d="M 50 45 Q 200 5 400 45 T 750 45" fill="none" stroke="url(#reiatsu-grad)" stroke-width="3" opacity="0.6"/>
  <path d="M 100 50 Q 300 85 500 35 T 700 55" fill="none" stroke="url(#reiatsu-grad)" stroke-width="1.5" opacity="0.4"/>

  <!-- Center Emblem Graphic Accent -->
  <g transform="translate(400, 45)">
    <!-- Stylized Slash Graphic Accent -->
    <path d="M -180 15 L 180 -15 L 160 -8 L -160 22 Z" fill="url(#blade-glow)" filter="url(#glow)" />
    <!-- Center Sparkle Diamond -->
    <polygon points="0,-6 6,0 0,6 -6,0" fill="#E9CCD3" />
  </g>
</svg>
