<svg viewBox="0 0 850 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&amp;family=Plus+Jakarta+Sans:wght@500;700&amp;display=swap');
      
      @keyframes sparkle-pulse {
        0%, 100% { opacity: 0.3; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.3); }
      }
      .star-dot {
        animation: sparkle-pulse 3s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .main-heading {
        font-family: 'Outfit', 'Plus Jakarta Sans', 'Trebuchet MS', 'Segoe UI', sans-serif;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.5px;
      }
      .body-subtext {
        font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.3px;
      }
    </style>

    <linearGradient id="about-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0822" />
      <stop offset="50%" stop-color="#1A0C36" />
      <stop offset="100%" stop-color="#0B061A" />
    </linearGradient>

    <linearGradient id="about-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#C084FC" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="text-highlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F5D0FE" />
      <stop offset="80%" stop-color="#E879F9" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <radialGradient id="nebula-spot" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#9333EA" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#4C1D95" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <clipPath id="card-clip">
      <rect x="2" y="2" width="846" height="156" rx="16" />
    </clipPath>
  </defs>

  <!-- Container Frame -->
  <rect x="1" y="1" width="848" height="158" rx="17" fill="url(#about-bg)" stroke="url(#about-border)" stroke-width="1.8" />

  <g clip-path="url(#card-clip)">
    <!-- Nebula Ambient Background Light -->
    <circle cx="425" cy="80" r="260" fill="url(#nebula-spot)" />

    <!-- Sprinkled Stardust Dots -->
    <circle cx="60" cy="40" r="1.5" fill="#F472B6" class="star-dot" style="animation-delay: 0s;" />
    <circle cx="120" cy="120" r="1.2" fill="#FFFFFF" class="star-dot" style="animation-delay: 1.2s;" />
    <circle cx="740" cy="35" r="1.8" fill="#38BDF8" class="star-dot" style="animation-delay: 0.7s;" />
    <circle cx="790" cy="125" r="1.4" fill="#C084FC" class="star-dot" style="animation-delay: 1.8s;" />

    <!-- Side Diamond Accents -->
    <polygon points="40,80 44,75 48,80 44,85" fill="#F472B6" opacity="0.8" />
    <polygon points="810,80 806,75 802,80 806,85" fill="#38BDF8" opacity="0.8" />

    <!-- Top Badge -->
    <g transform="translate(425, 42)">
      <rect x="-70" y="-12" width="140" height="24" rx="12" fill="#120A29" stroke="#C084FC" stroke-width="1" opacity="0.9" />
      <text text-anchor="middle" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#F472B6" letter-spacing="2.5">
        ✦ ABOUT ME ✦
      </text>
    </g>

    <!-- Main Bold Heading: Software Engineering enthusiast. -->
    <g transform="translate(425, 92)">
      <text text-anchor="middle" class="main-heading" fill="url(#text-highlight)">
        Software Engineering enthusiast.
      </text>
    </g>

    <!-- Subtext Line: Learning, building, and sharing code that might make someone's life a little easier. -->
    <g transform="translate(425, 126)">
      <text text-anchor="middle" class="body-subtext" fill="#E9CCD3" opacity="0.95">
        Learning, building, and sharing code that might make someone's life a little easier.
      </text>
    </g>
  </g>
</svg>
