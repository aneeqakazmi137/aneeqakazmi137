<svg viewBox="0 0 490 232" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code', 'Consolas', monospace">
  <style>
    .row {
      opacity: 0;
      transform: translateX(-8px);
      animation: fadein 0.5s ease-out forwards;
    }
    @keyframes fadein {
      to { opacity: 1; transform: translateX(0); }
    }
    .key-text { fill: #B199DB; font-size: 14px; font-weight: 700; }
    .val-text { fill: #E9CCD3; font-size: 13px; }
    .bar-text { fill: #E9CCD3; font-size: 13px; font-weight: 700; }
  </style>

  <rect x="1" y="1" width="488" height="230" rx="10"
        fill="#26264C" stroke="#724972" stroke-width="1.5"/>

  <rect x="1" y="1" width="488" height="34" rx="10" fill="#45538A"/>
  <rect x="1" y="18" width="488" height="17" fill="#45538A"/>
  <circle cx="20" cy="18" r="5" fill="#E9CCD3" opacity="0.85"/>
  <circle cx="38" cy="18" r="5" fill="#B199DB" opacity="0.85"/>
  <circle cx="56" cy="18" r="5" fill="#724972" opacity="0.85"/>
  <text x="245.0" y="23" text-anchor="middle" class="bar-text">aneeqa@github</text>

  
    <g class="row" style="animation-delay:0.50s">
      <text x="34" y="58" class="key-text">Now</text>
      <text x="150" y="58" class="val-text">BSCS @ COMSATS Wah Campus</text>
    </g>
    <g class="row" style="animation-delay:0.72s">
      <text x="34" y="88" class="key-text">Stack</text>
      <text x="150" y="88" class="val-text">C++ · Python · TS/JS · Next.js</text>
    </g>
    <g class="row" style="animation-delay:0.94s">
      <text x="34" y="118" class="key-text">Tools</text>
      <text x="150" y="118" class="val-text">Tailwind · MySQL · Prolog · Git</text>
    </g>
    <g class="row" style="animation-delay:1.16s">
      <text x="34" y="148" class="key-text">Building</text>
      <text x="150" y="148" class="val-text">PakFuel Crisis Tracker</text>
    </g>
    <g class="row" style="animation-delay:1.38s">
      <text x="34" y="178" class="key-text">Mindset</text>
      <text x="150" y="178" class="val-text">Learning. Building. Repeating.</text>
    </g>
</svg>
